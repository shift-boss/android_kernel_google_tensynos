name: Build Sultan Tensor GKI Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space & Install Legacy Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev git python3 libkmod-dev lz4 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu crossbuild-essential-arm64 libncurses5 libtinfo5 libncurses6

          # Fix missing libncurses.so.5 symlink for Ubuntu runners
          sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Checkout Kernel Source Code
        uses: actions/checkout@v4

      - name: Setup Clang Toolchain via Git Clone
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 $GITHUB_WORKSPACE/toolchain/clang-repo

      - name: Compile Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Find latest clang binary path dynamically
          CLANG_DIR=$(find $GITHUB_WORKSPACE/toolchain/clang-repo -name "clang" -type f | grep -v "3289846" | head -n 1 | xargs dirname)
          if [ -z "$CLANG_DIR" ]; then
            CLANG_DIR=$(find $GITHUB_WORKSPACE/toolchain/clang-repo -name "clang" -type f | head -n 1 | xargs dirname)
          fi
          export PATH=$CLANG_DIR:$PATH
          
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          # Build GKI configuration
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 gki_defconfig

          # Compile Image.lz4 binary
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 Image.lz4 || make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pixel8Pro-Kernel
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image*

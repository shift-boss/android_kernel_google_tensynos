name: Build Sultan Tensor GKI Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev git python3 libkmod-dev lz4 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Checkout Kernel Source Code
        uses: actions/checkout@v4

      - name: Setup Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b master clang

      - name: Compile Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Dynamic PATH setup for Clang
          CLANG_BIN=$(find $GITHUB_WORKSPACE/toolchain/clang -name "clang" -type f | head -n 1 | xargs dirname)
          export PATH=$CLANG_BIN:$PATH
          
          # Tell make to use llvm-ar, llvm-nm, etc., and aarch64-linux-gnu- for CROSS_COMPILE
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          # 1. Build defconfig with full LLVM environment overrides
          make O=out ARCH=arm64 CC=clang REAL_CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 gki_defconfig

          # 2. Compile kernel
          make -j$(nproc) O=out ARCH=arm64 CC=clang REAL_CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 Image.lz4 || make -j$(nproc) O=out ARCH=arm64 CC=clang REAL_CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pixel8Pro-Kernel
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image*
